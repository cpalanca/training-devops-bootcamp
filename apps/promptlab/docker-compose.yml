services:
  api:
    build: ./backend
    ports:
      - "3001:3001"
    networks:
      - promptlab
    volumes:
      - api-data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    networks:
      - promptlab
    depends_on:
      - api

networks:
  promptlab:

volumes:
  api-data:
